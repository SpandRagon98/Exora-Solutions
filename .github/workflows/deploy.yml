name: Publish Static Site To gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare deployment folder
        run: |
          test -f index.html
          rm -rf "$RUNNER_TEMP/exora-pages"
          mkdir -p "$RUNNER_TEMP/exora-pages"
          cp index.html "$RUNNER_TEMP/exora-pages/index.html"
          touch "$RUNNER_TEMP/exora-pages/.nojekyll"

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1 || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/exora-pages/." .

          git add index.html .nojekyll

          if git diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "Deploy static site from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
