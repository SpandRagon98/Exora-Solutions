<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXORA SOLUTIONS — Engineering Digital Experiences That Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,200;0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   EXORA SOLUTIONS — APP AGENCY DESIGN SYSTEM
   Identity: Obsidian Tech · Electric Precision
   Fonts: Syne (display) · DM Sans (body) · DM Mono (data)
   ═══════════════════════════════════════════ */
:root {
  --ink:       #080808;
  --ink-2:     #0d0d0f;
  --ink-3:     #111318;
  --panel:     #14161c;
  --panel-2:   #1a1d26;
  --line:      rgba(255,255,255,0.07);
  --line-b:    rgba(99,179,255,0.15);
  --blue:      #3b82f6;
  --blue-2:    #60a5fa;
  --blue-glow: rgba(59,130,246,0.35);
  --blue-haze: rgba(59,130,246,0.08);
  --cyan:      #22d3ee;
  --cyan-glow: rgba(34,211,238,0.25);
  --white:     #f8fafc;
  --silver:    #94a3b8;
  --silver-2:  #64748b;
  --silver-dim: rgba(148,163,184,0.45);
  --gold:      #f59e0b;
  --font-d:    'Syne', sans-serif;
  --font-b:    'DM Sans', sans-serif;
  --font-m:    'DM Mono', monospace;
  --ease:      cubic-bezier(0.16,1,0.3,1);
  --ease-2:    cubic-bezier(0.23,1,0.32,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
section[id] { scroll-margin-top: 86px; }
body {
  background: var(--ink);
  color: var(--white);
  font-family: var(--font-b);
  overflow-x: hidden;
  cursor: none;
}
a { color: inherit; text-decoration: none; }
button { cursor: none; font-family: var(--font-b); border: none; background: none; }
::selection { background: rgba(59,130,246,0.3); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 2px; }

/* CURSOR */
#x-cursor {
  position: fixed; width: 8px; height: 8px;
  background: var(--blue-2); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  transition: width .3s var(--ease), height .3s var(--ease), background .3s, opacity .3s;
  box-shadow: 0 0 16px var(--blue-glow);
}
#x-ring {
  position: fixed; width: 28px; height: 28px;
  border: 1px solid rgba(59,130,246,0.5);
  border-radius: 50%; pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  transition: width .5s var(--ease-2), height .5s var(--ease-2), border-color .3s;
}
#mouse-light {
  position: fixed;
  width: 420px;
  height: 420px;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle,
      rgba(96,165,250,0.22) 0%,
      rgba(59,130,246,0.12) 22%,
      rgba(34,211,238,0.07) 42%,
      rgba(59,130,246,0.025) 58%,
      rgba(0,0,0,0) 72%);
  filter: blur(28px);
  mix-blend-mode: screen;
  opacity: .95;
  will-change: transform;
}
.cursor-xl #x-cursor { width: 52px; height: 52px; background: transparent; border: 1px solid var(--blue-2); box-shadow: 0 0 30px var(--blue-glow); }
.cursor-xl #x-ring { opacity: 0; }

/* LOADER */
#loader {
  position: fixed; inset: 0;
  background: var(--ink); z-index: 10000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2rem;
  transition: opacity .9s var(--ease), visibility .9s;
}
#loader.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.ld-logo {
  font-family: var(--font-d); font-size: 1.2rem; font-weight: 800;
  letter-spacing: .5em; color: var(--white);
  display: flex; overflow: hidden; padding-right: .5em;
}
.ld-char {
  display: inline-block; opacity: 0;
  transform: translateY(100%);
  animation: c-up .5s var(--ease) forwards;
}
@keyframes c-up { to { opacity: 1; transform: none; } }
.ld-tag {
  font-family: var(--font-m); font-size: .58rem;
  letter-spacing: .35em; color: var(--silver-2);
  opacity: 0; animation: fade .4s .8s forwards;
}
.ld-prog {
  width: 140px; height: 1px;
  background: rgba(255,255,255,0.06);
  position: relative; overflow: hidden;
}
.ld-prog-fill {
  position: absolute; inset-y: 0; left: 0; width: 0;
  background: linear-gradient(90deg, transparent, var(--blue), var(--cyan), transparent);
  animation: prog 2s var(--ease) .5s forwards;
}
@keyframes prog { to { width: 100%; } }
@keyframes fade { to { opacity: 1; } }

/* GRID OVERLAY */
.grid-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 30%, transparent 80%);
}

/* ── COMMON ATOMS ── */
.tag {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: var(--font-m); font-size: .58rem;
  letter-spacing: .3em; text-transform: uppercase; color: var(--blue-2);
}
.tag::before { content: ''; display: block; width: 16px; height: 1px; background: var(--blue-2); }

.h1 {
  font-family: var(--font-d); font-size: clamp(3.2rem, 7vw, 7rem);
  font-weight: 800; line-height: .96; letter-spacing: -.03em;
  color: var(--white);
}
.h2 {
  font-family: var(--font-d); font-size: clamp(2rem, 4vw, 3.6rem);
  font-weight: 700; line-height: 1.05; letter-spacing: -.025em;
  color: var(--white);
}
.h3 {
  font-family: var(--font-d); font-size: 1.4rem;
  font-weight: 600; line-height: 1.2; color: var(--white);
}
.lead {
  font-size: 1.05rem; font-weight: 300; line-height: 1.75;
  color: var(--silver);
}
.muted {
  font-size: .85rem; font-weight: 300; line-height: 1.7;
  color: var(--silver-2);
}

/* BUTTONS */
.btn-p {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .85rem 2rem;
  background: var(--blue);
  border-radius: 6px;
  font-family: var(--font-d); font-size: .8rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--white);
  transition: all .3s var(--ease); cursor: none; position: relative; overflow: hidden;
}
.btn-p::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
  opacity: 0; transition: opacity .3s;
}
.btn-p:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--blue-glow); }
.btn-p:hover::after { opacity: 1; }

.btn-o {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .85rem 2rem;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-family: var(--font-d); font-size: .8rem; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--silver);
  transition: all .3s var(--ease); cursor: none;
}
.btn-o:hover { border-color: rgba(59,130,246,.4); color: var(--white); background: var(--blue-haze); }

/* CARDS */
.glass-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  transition: border-color .3s, transform .4s var(--ease), box-shadow .4s;
}
.glass-card:hover {
  border-color: var(--line-b);
  transform: translateY(-4px);
  box-shadow: 0 16px 48px rgba(0,0,0,.4), 0 0 0 1px var(--line-b);
}

/* SECTION */
.section { padding: 130px 0; position: relative; z-index: 2; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 3rem; }
.container-sm { max-width: 900px; margin: 0 auto; padding: 0 3rem; }

/* REVEAL */
.rv { opacity: 0; transform: translateY(28px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.rv.in { opacity: 1; transform: none; }
.rv-d1 { transition-delay: .1s; } .rv-d2 { transition-delay: .2s; }
.rv-d3 { transition-delay: .3s; } .rv-d4 { transition-delay: .4s; }
.rv-d5 { transition-delay: .5s; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: 68px; padding: 0 3rem;
  display: flex; align-items: center; justify-content: space-between;
  transition: background .5s, border-color .5s;
  border-bottom: 1px solid transparent;
}
nav.scrolled {
  background: rgba(8,8,8,.9);
  backdrop-filter: blur(24px) saturate(1.5);
  border-bottom-color: var(--line);
}
.nav-brand {
  font-family: var(--font-d); font-size: 1.1rem; font-weight: 800;
  letter-spacing: .12em; color: var(--white);
  display: flex; align-items: center; gap: .5rem;
}
.nav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 8px var(--blue-glow);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)} }
.nav-links { display: flex; gap: 2.5rem; list-style: none; }
.nav-links a {
  font-family: var(--font-b); font-size: .78rem; font-weight: 500;
  letter-spacing: .08em; color: var(--silver);
  transition: color .25s; position: relative;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -3px; left: 0; right: 0;
  height: 1px; background: var(--blue-2);
  transform: scaleX(0); transition: transform .3s var(--ease); transform-origin: left;
}
.nav-links a:hover { color: var(--white); }
.nav-links a:hover::after { transform: scaleX(1); }

/* HERO */
#hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  text-align: center;
}
.hero-ambient {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(59,130,246,0.14) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 20% 80%, rgba(34,211,238,0.05) 0%, transparent 60%);
}
.hero-orbs { position: absolute; inset: 0; overflow: hidden; }
.orb {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: .5;
  animation: orb-d 14s ease-in-out infinite;
}
.o1 { width: 600px; height: 600px; top: -200px; left: -100px; background: radial-gradient(circle, rgba(59,130,246,.3), transparent 70%); }
.o2 { width: 400px; height: 400px; bottom: -100px; right: -50px; background: radial-gradient(circle, rgba(34,211,238,.15), transparent 70%); animation-delay: -7s; }
@keyframes orb-d { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }

.hero-code-bg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; opacity: .04; pointer-events: none;
  font-family: var(--font-m); font-size: .65rem; line-height: 1.8;
  color: var(--blue-2); letter-spacing: .05em;
  white-space: pre; padding: 4rem;
}
.hero-content {
  position: relative; z-index: 2;
  max-width: 900px; padding: 0 2rem;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .4rem 1rem;
  border: 1px solid var(--line-b);
  border-radius: 100px;
  font-family: var(--font-m); font-size: .58rem;
  letter-spacing: .2em; color: var(--blue-2);
  background: var(--blue-haze);
  margin-bottom: 2rem;
  opacity: 0; animation: fade-up .7s var(--ease) .3s forwards;
}
.hero-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
.hero-h1 {
  opacity: 0; transform: translateY(24px);
  animation: fade-up .9s var(--ease) .5s forwards;
  margin-bottom: 1.5rem;
}
.hero-h1 .accent {
  background: linear-gradient(135deg, var(--blue-2), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-sub {
  font-size: 1rem; font-weight: 300; letter-spacing: .25em;
  text-transform: uppercase; color: var(--silver);
  margin-bottom: 3rem;
  opacity: 0; animation: fade-up .7s var(--ease) .75s forwards;
}
.hero-lead {
  max-width: 760px;
  margin: 0 auto 2rem;
  font-size: 1.02rem;
  line-height: 1.8;
  font-weight: 300;
  color: var(--silver);
  opacity: 0;
  animation: fade-up .7s var(--ease) .75s forwards;
}
.hero-proof {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .6rem;
  margin-top: 1.5rem;
  opacity: 0;
  animation: fade-up .7s var(--ease) 1.1s forwards;
}
.hero-proof span {
  padding: .38rem .8rem;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.03);
  border-radius: 999px;
  font-family: var(--font-m);
  font-size: .58rem;
  letter-spacing: .14em;
  color: var(--silver);
  text-transform: uppercase;
}
.hero-proof-line {
  margin-top: .9rem;
  font-size: .82rem;
  color: var(--silver-2);
  letter-spacing: .16em;
  text-transform: uppercase;
  opacity: 0;
  animation: fade-up .7s var(--ease) 1.2s forwards;
}
.hero-ctas {
  display: flex; align-items: center; justify-content: center; gap: 1rem;
  opacity: 0; animation: fade-up .7s var(--ease) .95s forwards;
}
.hero-scroll {
  position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: .6rem;
  opacity: 0; animation: fade .8s 1.6s forwards;
}
.hero-scroll span { font-family: var(--font-m); font-size: .55rem; letter-spacing: .3em; color: var(--silver-2); }
.scroll-track { width: 1px; height: 40px; background: linear-gradient(to bottom, var(--blue-2), transparent); animation: scroll-anim 2s ease-in-out infinite; }
@keyframes scroll-anim { 0%,100%{opacity:.3;transform:scaleY(.5);transform-origin:top} 50%{opacity:1;transform:scaleY(1);transform-origin:top} }
@keyframes fade-up { to { opacity: 1; transform: none; } }

/* METRICS BAR */
.metrics-bar {
  background: var(--panel);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 1.25rem 0;
}
.metrics-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 3rem;
  display: flex; justify-content: center; gap: 0;
}
.metric {
  flex: 1; text-align: center;
  padding: 0 2rem;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: .25rem;
}
.metric:last-child { border-right: none; }
.metric-n {
  font-family: var(--font-d); font-size: 1.8rem; font-weight: 800;
  line-height: 1; color: var(--white);
}
.metric-n span { color: var(--blue-2); }
.metric-l { font-family: var(--font-m); font-size: .55rem; letter-spacing: .2em; color: var(--silver-2); }

/* PILLARS */
#pillars { background: var(--ink-2); }
.pillars-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
  background: var(--line); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; margin-top: 4rem;
}
.pillar-card {
  background: var(--ink-2); padding: 3rem 2.5rem;
  position: relative; overflow: hidden;
  transition: background .4s;
}
.pillar-card:hover { background: var(--panel); }
.pillar-num {
  font-family: var(--font-m); font-size: .6rem;
  letter-spacing: .3em; color: var(--silver-2); margin-bottom: 1.5rem;
}
.pillar-icon {
  width: 48px; height: 48px; margin-bottom: 1.5rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .3s, box-shadow .3s;
}
.pillar-card:hover .pillar-icon { border-color: var(--line-b); box-shadow: 0 0 20px var(--blue-glow); }
.pillar-name { font-family: var(--font-d); font-size: 1.5rem; font-weight: 700; margin-bottom: .75rem; }
.pillar-desc { font-size: .83rem; font-weight: 300; line-height: 1.7; color: var(--silver-2); margin-bottom: 1.5rem; }
.pillar-items { display: flex; flex-direction: column; gap: .5rem; }
.pillar-item {
  display: flex; align-items: center; gap: .6rem;
  font-size: .78rem; color: var(--silver);
}
.pillar-item::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--blue-2); flex-shrink: 0; }
.pillar-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
  transform: scaleX(0); transition: transform .5s var(--ease);
  transform-origin: left;
}
.pillar-card:hover .pillar-bar { transform: scaleX(1); }

/* INDUSTRIES */
#industries { background: var(--ink); }
.ind-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem;
  margin-top: 3.5rem;
}
.ind-card {
  padding: 1.75rem 1.5rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex; align-items: center; gap: 1rem;
  cursor: none;
  transition: all .3s var(--ease);
  position: relative; overflow: hidden;
}
.ind-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 50%, var(--blue-haze), transparent 70%);
  opacity: 0; transition: opacity .4s;
}
.ind-card:hover { border-color: var(--line-b); transform: translateX(4px); }
.ind-card:hover::before { opacity: 1; }
.ind-icon {
  width: 44px; height: 44px; border-radius: 8px;
  background: var(--blue-haze); border: 1px solid var(--line-b);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ind-name { font-family: var(--font-d); font-size: 1rem; font-weight: 700; }
.ind-count { font-family: var(--font-m); font-size: .58rem; letter-spacing: .2em; color: var(--silver-2); margin-top: .2rem; }
.ind-arrow { margin-left: auto; color: var(--silver-2); transition: transform .3s var(--ease), color .3s; }
.ind-card:hover .ind-arrow { transform: translateX(4px); color: var(--blue-2); }

/* SERVICES */
#services { background: var(--ink-2); }
.services-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--line); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; margin-top: 4rem;
}
.svc-card {
  background: var(--ink-2); padding: 2.5rem;
  display: flex; flex-direction: column; gap: 1.25rem;
  position: relative; overflow: hidden;
  transition: background .3s;
}
.svc-card:hover { background: var(--panel); }
.svc-n {
  font-family: var(--font-m); font-size: .55rem;
  letter-spacing: .25em; color: var(--silver-2);
}
.svc-title { font-family: var(--font-d); font-size: 1.25rem; font-weight: 700; }
.svc-desc { font-size: .83rem; font-weight: 300; line-height: 1.7; color: var(--silver-2); flex: 1; }
.svc-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.svc-tag {
  padding: .25rem .6rem;
  background: var(--blue-haze); border: 1px solid var(--line-b);
  border-radius: 4px;
  font-family: var(--font-m); font-size: .58rem;
  letter-spacing: .1em; color: var(--blue-2);
}
.svc-line {
  position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(to bottom, var(--blue), var(--cyan));
  transform: scaleY(0); transition: transform .5s var(--ease); transform-origin: top;
}
.svc-card:hover .svc-line { transform: scaleY(1); }

/* CASE STUDIES */
#cases { background: var(--ink); }
.cases-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 4rem; }
.case-item {
  background: var(--ink); padding: 2.5rem 3rem;
  display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 3rem; align-items: start;
  cursor: none;
  transition: background .3s;
  position: relative;
}
.case-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(to bottom, var(--blue), var(--cyan));
  transform: scaleY(0); transition: transform .4s var(--ease); transform-origin: top;
}
.case-item:hover { background: var(--panel); }
.case-item:hover::before { transform: scaleY(1); }
.case-n {
  font-family: var(--font-m); font-size: .55rem; letter-spacing: .25em; color: var(--silver-2); margin-bottom: .75rem;
}
.case-title { font-family: var(--font-d); font-size: 1.3rem; font-weight: 700; margin-bottom: .5rem; }
.case-industry {
  display: inline-block; padding: .25rem .7rem;
  background: var(--blue-haze); border: 1px solid var(--line-b);

  letter-spacing: .1em; color: var(--blue-2);
}
.case-story p { font-size: .85rem; line-height: 1.75; color: var(--silver); }
.case-story p + p { margin-top: .75rem; }
.case-label { font-family: var(--font-m); font-size: .55rem; letter-spacing: .25em; color: var(--silver-2); text-transform: uppercase; margin-bottom: .5rem; }
.case-result-val { font-family: var(--font-d); font-size: 2.2rem; font-weight: 800; line-height: 1; }
.case-result-val.pos { color: var(--cyan); }
.case-result-desc { font-size: .78rem; color: var(--silver-2); margin-top: .3rem; }

/* ESTIMATOR */
#estimator { background: var(--ink-2); }
.est-wrap {

}
.est-left { background: var(--ink-2); padding: 3rem; }
.est-right { background: var(--panel); padding: 3rem; display: flex; flex-direction: column; }
.est-title { font-family: var(--font-d); font-size: 1.3rem; font-weight: 700; margin-bottom: 2rem; }
.est-section-title {
  font-family: var(--font-m); font-size: .58rem;
  letter-spacing: .2em; color: var(--silver-2); text-transform: uppercase;
  margin-bottom: .75rem; margin-top: 1.5rem;
}
.est-section-title:first-child { margin-top: 0; }
.est-options { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
.est-opt {
  padding: .5rem 1rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-family: var(--font-b); font-size: .78rem; font-weight: 400; color: var(--silver);
  cursor: none; transition: all .25s;
}
.est-opt.sel {
  border-color: var(--blue); color: var(--blue-2);

}
.est-opt:hover:not(.sel) { border-color: rgba(59,130,246,.25); color: var(--white); }
.est-feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.est-feat {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .75rem;
  border: 1px solid var(--line); border-radius: 6px;
  font-size: .75rem; color: var(--silver); cursor: none;
  transition: all .25s;
}
.est-feat.sel { border-color: var(--blue); color: var(--blue-2); background: var(--blue-haze); }
.est-feat:hover:not(.sel) { border-color: rgba(59,130,246,.25); color: var(--white); }
.est-check {
  width: 14px; height: 14px; border: 1px solid var(--line);
  border-radius: 3px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; transition: all .25s;
}
.est-feat.sel .est-check { background: var(--blue); border-color: var(--blue); color: white; }
.est-result-title { font-family: var(--font-d); font-size: 1.1rem; font-weight: 600; color: var(--silver); margin-bottom: 2rem; }
.est-breakdown { flex: 1; }
.est-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: .75rem 0; border-bottom: 1px solid var(--line);
  font-size: .83rem;
}
.est-row .lbl { color: var(--silver); }
.est-row .val { font-family: var(--font-m); color: var(--silver); font-size: .78rem; }
.est-total {
  margin-top: 1.5rem; padding-top: 1.5rem;
  border-top: 1px solid var(--line-b);
  display: flex; justify-content: space-between; align-items: flex-end;
}
.est-total-lbl { font-family: var(--font-d); font-size: .85rem; font-weight: 600; }
.est-total-val {
  font-family: var(--font-d); font-size: 3rem; font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, var(--blue-2), var(--cyan));

  transition: all .4s var(--ease);
}
.est-timeline {
  margin-top: 1rem; padding: .75rem 1rem;
  background: var(--blue-haze); border: 1px solid var(--line-b);
  border-radius: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.est-timeline .lbl { font-family: var(--font-m); font-size: .58rem; letter-spacing: .2em; color: var(--silver-2); }
.est-timeline .val { font-family: var(--font-d); font-size: 1.1rem; font-weight: 700; color: var(--blue-2); }
.est-actions { margin-top: 2rem; display: flex; flex-direction: column; gap: .75rem; }
.btn-est-p {
  padding: .9rem; border-radius: 8px;
  background: var(--blue); border: none;
  font-family: var(--font-d); font-size: .78rem; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: white;
  cursor: none; transition: all .3s var(--ease);
  display: flex; align-items: center; justify-content: center; gap: .5rem;
}
.btn-est-p:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--blue-glow); }
.btn-est-s {
  padding: .9rem; border-radius: 8px;
  background: transparent; border: 1px solid var(--line);
  font-family: var(--font-d); font-size: .78rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--silver);
  cursor: none; transition: all .3s;
  display: flex; align-items: center; justify-content: center; gap: .5rem;
}
.btn-est-s:hover { border-color: var(--line-b); color: var(--white); }

/* WHY */
#why { background: var(--ink); }
.why-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem;
  margin-top: 4rem;
}
.why-card {
  padding: 2rem 1.75rem;

}

.why-icon { width: 40px; height: 40px; margin-bottom: 1.25rem; }
.why-title { font-family: var(--font-d); font-size: 1rem; font-weight: 700; margin-bottom: .5rem; }
.why-desc { font-size: .78rem; line-height: 1.65; color: var(--silver-2); }

/* TESTIMONIALS */
#testimonials { background: var(--ink-2); overflow: hidden; }
.testi-track {
  display: flex; gap: 1.25rem; overflow-x: auto; scrollbar-width: none;

}
.testi-track::-webkit-scrollbar { display: none; }
.testi-card {
  flex: 0 0 380px; scroll-snap-align: start;

}
.testi-card:hover { border-color: var(--line-b); transform: translateY(-4px); }
.testi-q {

}
.testi-text {

}

.testi-av {

  color: white; flex-shrink: 0;
}
.testi-name { font-family: var(--font-d); font-size: .85rem; font-weight: 700; }
.testi-role { font-family: var(--font-m); font-size: .55rem; letter-spacing: .15em; color: var(--silver-2); margin-top: .15rem; }
.testi-dots { display: flex; justify-content: center; gap: .4rem; margin-top: 2rem; }
.t-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line); cursor: none; transition: all .3s; }
.t-dot.a { width: 20px; border-radius: 3px; background: var(--blue); }

/* CONTACT */
#contact { background: var(--ink); }
.contact-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 4rem; margin-top: 4rem; }
.contact-left { display: flex; flex-direction: column; justify-content: space-between; }
.contact-info-list { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 2rem; }
.c-info-item { display: flex; align-items: center; gap: .75rem; font-size: .85rem; color: var(--silver); }
.c-info-item svg { flex-shrink: 0; color: var(--blue-2); }
.cal-block {

.cal-desc { font-size: .78rem; color: var(--silver-2); line-height: 1.6; margin-bottom: 1rem; }

}

.btn-glow {

@keyframes glow-pulse { 0%,100%{ box-shadow: 0 0 40px var(--blue-glow), 0 8px 32px rgba(59,130,246,.3); } 50%{ box-shadow: 0 0 70px var(--blue-glow), 0 12px 48px rgba(59,130,246,.5); } }

/* FOOTER */
footer {

.footer-links { display: flex; gap: 2rem; list-style: none; }

/* TOAST */
.toast-wrap {

.toast {

}

.toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }

/* RESPONSIVE */
@media(max-width:1024px){

  .ind-grid { grid-template-columns: 1fr 1fr; }

  .ind-grid { grid-template-columns: 1fr; }
  footer { flex-direction: column; padding: 2.5rem 1.5rem; }
  .f-row { grid-template-columns: 1fr; }
}

/* ── CURSOR ── */
function Cursor() {
  useEffect(() => {
    const cur = document.getElementById('x-cursor');
    const ring = document.getElementById('x-ring');
    const light = document.getElementById('mouse-light');
    if (!cur || !ring || !light) return;

    let mx = window.innerWidth / 2;
    let my = window.innerHeight / 2;
    let rx = mx, ry = my;
    let lx = mx, ly = my;
    let rafId = null;

    const move = e => {
      mx = e.clientX;
      my = e.clientY;
      cur.style.left = mx + 'px';
      cur.style.top = my + 'px';
    };

    const onLeave = () => {
      light.style.opacity = '0';
      ring.style.opacity = '0';
      cur.style.opacity = '0';
    };

    const onEnter = () => {
      light.style.opacity = '.95';
      ring.style.opacity = '';
      cur.style.opacity = '';
    };

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseleave', onLeave);
    document.addEventListener('mouseenter', onEnter);

    const anim = () => {
      rx += (mx - rx) * 0.15;
      ry += (my - ry) * 0.15;
      lx += (mx - lx) * 0.08;
      ly += (my - ly) * 0.08;

      ring.style.left = rx + 'px';
      ring.style.top = ry + 'px';
      light.style.left = lx + 'px';
      light.style.top = ly + 'px';

      rafId = requestAnimationFrame(anim);
    };
    anim();

    const targets = document.querySelectorAll('button,a,.product-card,.glass-card,.ind-card,.svc-card,.case-item,.why-card,.pillar-card,.testi-card,.est-opt,.est-feat');
    const over = () => document.body.classList.add('cursor-xl');
    const out = () => document.body.classList.remove('cursor-xl');
    targets.forEach(t => {
      t.addEventListener('mouseenter', over);
      t.addEventListener('mouseleave', out);
    });

    return () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseleave', onLeave);
      document.removeEventListener('mouseenter', onEnter);
      targets.forEach(t => {
        t.removeEventListener('mouseenter', over);
        t.removeEventListener('mouseleave', out);
      });
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);
  return null;
}

/* ── REVEAL HOOK ── */
function useReveal() {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.rv').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

/* ── METRICS ── */
function Metrics() {
  const [counted, setCounted] = useState(false);
  const ref = useRef(null);
  const data = [
    { n: 120, suf: '+', label: 'Apps Shipped' },
    { n: 40, suf: '+', label: 'Enterprise Clients' },
    { n: 8, suf: '', label: 'Years of Excellence' },
    { n: 98, suf: '%', label: 'Client Retention' },
  ];
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setCounted(true); obs.disconnect(); } }, { threshold: 0.5 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div className="metrics-bar rv" ref={ref}>
      <div className="metrics-inner">
        {data.map((d, i) => <Counter key={i} {...d} counted={counted} />)}
      </div>
    </div>
  );
}
function Counter({ n, suf = '', label, counted }) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!counted) return;
    let start = 0;
    const dur = 1800;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(ease * n));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [counted, n]);
  return (
    <div className="metric">
      <div className="metric-n">{val}<span>{suf}</span></div>
      <div className="metric-l">{label}</div>
    </div>
  );
}

              <div className="why-title">{w.title}</div>
              <p className="why-desc">{w.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ── TESTIMONIALS ── */
function Testimonials() {
  useReveal();
  const [active, setActive] = useState(0);
  const trackRef = useRef(null);
  const testi = [
    { init: 'MK', name: 'Marcus Klein', role: 'CEO · NovaPay', text: 'Exora didn\'t just build us an app. They challenged our business model in week one — and were right. That strategic layer is why we exited at $80M.' },
    { init: 'RP', name: 'Dr. Rohini Pillai', role: 'CTO · MedLink', text: 'The quality of thinking before the first wireframe was unlike anything I\'d seen from a dev agency. They\'re more like a product partner — we haven\'t worked with anyone else since.' },
    { init: 'AO', name: 'Amara Osei', role: 'Founder · Zest Commerce', text: 'We went from 0.8% to 4.1% conversion in 90 days post-launch. The AI personalization they built is genuinely our strongest competitive moat right now.' },
    { init: 'JS', name: 'Jonas Steiner', role: 'VP Product · ScaleStack', text: 'Five agencies pitched us. Exora were the only ones who presented a business case alongside their portfolio. The discipline they bring to scope is exceptional.' },
    { init: 'LC', name: 'Liu Chen', role: 'Head of Digital · CivicWave', text: 'Complex enterprise systems with 12 legacy API integrations — and they hit every milestone. The post-launch support SLA has been flawless for 18 months running.' },
  ];
  const scroll = (i) => {
    setActive(i);
    const track = trackRef.current;
    if (!track) return;
    const card = track.children[i];
    if (!card) return;
    const left = card.offsetLeft - track.offsetLeft;
    track.scrollTo({ left, behavior: 'smooth' });
  };
  useEffect(() => {
    const t = setInterval(() => setActive(prev => { const next = (prev + 1) % testi.length; scroll(next); return next; }), 5500);
    return () => clearInterval(t);
  }, []);

  return (
    <section id="testimonials" className="section">
      <div className="container rv" style={{ paddingBottom: 0 }}>
        <div className="tag" style={{ marginBottom:'1rem' }}>Client Voices</div>
        <h2 className="h2">Words from<br /><span style={{ color:'var(--silver)', fontStyle:'italic', fontWeight:400 }}>those who built with us.</span></h2>
      </div>
      <div className="testi-track" ref={trackRef}>
        {testi.map((t, i) => (
          <div key={i} className={`testi-card rv rv-d${(i%3)+1}`}>
            <div className="testi-q">"</div>
            <p className="testi-text">{t.text}</p>
            <div className="testi-author">
              <div className="testi-av">{t.init}</div>
              <div>
                <div className="testi-name">{t.name}</div>
                <div className="testi-role">{t.role}</div>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="testi-dots">
        {testi.map((_, i) => <div key={i} className={`t-dot ${active === i ? 'a' : ''}`} onClick={() => scroll(i)} />)}
      </div>
    </section>
  );
}

/* ── CONTACT ── */

  };
  return (
    <section id="contact" className="section">
      <div className="container">
        <div className="rv" style={{ textAlign:'center', marginBottom:'2rem' }}>
          <div className="tag" style={{ marginBottom:'1rem', justifyContent:'center' }}>Start a Project</div>
          <h2 className="h2">Let's build something<br /><span style={{ color:'var(--silver)', fontStyle:'italic', fontWeight:400 }}>the market hasn't seen yet.</span></h2>

        <div className="contact-grid">
          <div className="contact-left rv">
            <div>
              <p className="lead" style={{ marginBottom: '2rem' }}>We work with founders, product leaders, and enterprise teams who want a strategic partner — not just a vendor.</p>
              <div className="contact-info-list">
                <div className="c-info-item"><Icon name="mail" size={16} /><span>hello@exorasolutions.com</span></div>
                <div className="c-info-item"><Icon name="phone" size={16} /><span>+1 (415) 000-0000</span></div>
                <div className="c-info-item"><Icon name="pin" size={16} /><span>San Francisco · London · Dubai · Singapore</span></div>
              </div>
            </div>
            <div className="cal-block">
              <div style={{ display:'flex', alignItems:'center', gap:'.6rem', marginBottom:'.75rem' }}>
                <Icon name="cal" size={16} color="var(--blue-2)" />
                <div className="cal-title">Book a Discovery Call</div>
              </div>
              <p className="cal-desc">30 minutes. No pitch deck. Just a real conversation about your product and whether we're the right fit.</p>
              <button className="btn-o" onClick={() => showToast('Scheduling link coming soon!')}>
                Schedule 30-min Call <Icon name="arrow" size={14} />
              </button>
            </div>
          </div>
          <div className="rv rv-d2">
            <form className="contact-form" onSubmit={submit}>
              <div className="f-row">
                <div className="f-group">
                  <label className="f-label">Full Name</label>
                  <input type="text" className="f-input" placeholder="John Anderson" required />
                </div>
                <div className="f-group">
                  <label className="f-label">Company</label>
                  <input type="text" className="f-input" placeholder="Your Company" />
                </div>
              </div>
              <div className="f-row">
                <div className="f-group">
                  <label className="f-label">Email</label>
                  <input type="email" className="f-input" placeholder="you@company.com" required />
                </div>
                <div className="f-group">
                  <label className="f-label">Phone</label>
                  <input type="tel" className="f-input" placeholder="+1 (555) 000-0000" />
                </div>
              </div>
              <div className="f-group">
                <label className="f-label">Service Interested In</label>
                <select className="f-select">
                  <option>Custom App Development</option>
                  <option>UI/UX Design System</option>
                  <option>AI Integration</option>
                  <option>Product Consulting</option>
                  <option>Full Product Build</option>
                  <option>Not Sure Yet</option>
                </select>
              </div>
              <div className="f-group">
                <label className="f-label">Project Idea / Requirements</label>
                <textarea className="f-textarea" placeholder="Tell us about your project, goals, and any constraints — the more detail, the better our response." />
              </div>
              <button type="submit" className="f-submit">
                {submitted ? <><Icon name="check" size={16} /> Sent!</> : <>Send Message <Icon name="arrow" size={16} /></>}
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  );
}

}

/* ── APP ── */
function App() {
  useEffect(() => {
    const loaderTimer = setTimeout(() => document.getElementById('loader')?.classList.add('gone'), 2400);
    const onS = () => document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 60);
    window.addEventListener('scroll', onS, { passive: true });
    onS();

    const hash = window.location.hash.replace('#', '');
    if (hash) {
      requestAnimationFrame(() => {
        document.getElementById(hash)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    return () => {
      clearTimeout(loaderTimer);
      window.removeEventListener('scroll', onS);
    };
  }, []);

  return (
    <>
      <Cursor />
      <Nav />
      <Hero />
      <Metrics />
      <Pillars />
      <Industries />
      <Services />
      <Cases />
      <Estimator />
      <Why />
      <Testimonials />
      <Contact />
      <FinalCTA />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
